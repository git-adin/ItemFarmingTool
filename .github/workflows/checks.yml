name: Addon checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --target .tools -r tests/requirements.txt
      - name: Run offline Lua integration tests
        run: python tests/test_addon.py
      - name: Verify installable release packages
        run: python tests/test_package.py
